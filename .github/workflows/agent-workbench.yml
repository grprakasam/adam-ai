name: Agent workbench build
on:
  push:
    paths: ["frontend/**", ".github/workflows/agent-workbench.yml"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck:agent
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
