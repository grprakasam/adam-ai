<!DOCTYPE html>
<html>
<head>
    <title>Clear Authentication</title>
</head>
<body>
    <h1>Clearing Authentication...</h1>
    <script>
        localStorage.removeItem('adam_access_token');
        localStorage.removeItem('adam_user');
        alert('Authentication cleared! You will be redirected to login.');
        window.location.href = 'http://localhost:3000';
    </script>
</body>
</html>
